<!DOCTYPE html>
<html lang="ko" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} insta {% endblock %}</title>
    <!-- Bootstrap 5.3 CSS, 아이콘(Bootstrap Icons) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- 로고용 필기체 글꼴 (Grand Hotel) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- 위쪽 메뉴 -->
    <nav class="top-bar sticky-top">
        <div class="app-width bg-white border-bottom d-flex align-items-center justify-content-between px-3 py-2">
            <a href="/posts" class="logo text-dark text-decoration-none fs-2">insta</a>

            {% if user %}
            <!-- 로그인을 한경우 -->
            <div class="d-flex align-items-center gap-2">
                <span class="fw-semibold small">{{ user.username }}</span>
                <form action="/logout" method="post" class="m-0">
                    <input type="submit" value="로그아웃" class="btn btn-outline-secondary btn-sm">
                </form>
            </div>
            {% else %}
            <!-- 로그인이 안된경우 -->
            <div class="d-flex align-items-center gap-2">
                <a href="/login" class="btn btn-primary btn-sm">로그인</a>
                <a href="/signup" class="btn btn-outline-secondary btn-sm">회원가입</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <!-- 본문 -->
    <main class="app-width app-main bg-white px-3 py-3">

        {% block content %} {% endblock %}

    </main>

    <!-- 아래쪽 탭바 -->
    <nav class="tab-bar fixed-bottom">
        <div class="app-width bg-white border-top d-flex justify-content-around align-items-center py-2">
            <a href="/posts" class="tab-link" aria-label="전체 글"><i class="bi bi-house-door"></i></a>
            {% if user %}
            <a href="/posts/new" class="tab-link" aria-label="새글"><i class="bi bi-plus-square"></i></a>
            <a href="/users/{{ user.username }}" class="tab-link" aria-label="내 프로필"><i class="bi bi-person-circle"></i></a>
            {% else %}
            <a href="/login" class="tab-link" aria-label="로그인"><i class="bi bi-box-arrow-in-right"></i></a>
            <a href="/signup" class="tab-link" aria-label="회원가입"><i class="bi bi-person-plus"></i></a>
            {% endif %}
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
