

{% extends 'base.html' %}

{% block title %} 로그인 {% endblock %}

{% block content %}

  <div class="card p-4 mt-3">

    <!-- 로고 + 제목 -->
    <div class="text-center mb-4">
      <div class="logo display-4">insta</div>
      <div class="text-body-secondary">로그인</div>
    </div>

    <!-- 로그인 실패했을 때만 -->
    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form action="/login" method="post">
      <div class="form-floating mb-2">
        <input type="text" id="username" name="username" class="form-control" placeholder="아이디" required>
        <label for="username">아이디</label>
      </div>
      <div class="form-floating mb-3">
        <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호" required>
        <label for="password">비밀번호</label>
      </div>
      <input type="submit" value="로그인" class="btn btn-primary w-100">
    </form>

  </div>

  <p class="text-center mt-3 small">
    계정이 없으신가요? <a href="/signup" class="text-decoration-none">회원가입</a>
  </p>

{% endblock %}
