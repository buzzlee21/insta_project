
<!-- 기본 html 코드 가져오기 -->
{% extends 'base.html'%}

{% block title %} 전체 게시물 {%endblock %}

<!-- content 영역에 들어갈 코드 -->
{% block content %} 
 <h1>전체 게시물</h1>

    {% for post in posts%}
    <p>{{ post.id}}</p>
    <p>{{ post.content}}</p>
    <a href="/posts/{{post.id}}">상세보기</a>
    {% endfor%}
{% endblock %}
