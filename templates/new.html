
<!-- 기본 html 코드 가져오기 -->
{% extends 'base.html'%}


{% block title %} 새 글 {%endblock %}

<!-- content 영역에 들어갈 코드 -->
{% block content %} 
 <h1>NEW</h1>
    <form action="/posts/create" method="post" enctype="multipart/form-data">

        <input type="submit">        
        


    </form>
    
{% endblock %}
